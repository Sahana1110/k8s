apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-replicaset
  labels:
    app: nginx
spec:
  replicas: 3                        # Desired number of pods
  selector:
    matchLabels:
      app: nginx                     # Must match pod template labels
  template:
    metadata:
      labels:
        app: nginx                   # This must match selector above
    spec:
      containers:
      - name: nginx
        image: nginx:1.21.6
        ports:
        - containerPort: 80

